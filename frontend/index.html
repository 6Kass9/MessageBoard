<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Message Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Digital Message Board</h1>
            <p>Leave a friendly message for everyone to see!</p>
        </header>

        <main>
            <section class="form-section">
                <form id="message-form">
                    <div class="form-group">
                        <label for="username">Your Name</label>
                        <input type="text" id="username" placeholder="e.g., Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" placeholder="Type your message here..." maxlength="200" required></textarea>
                    </div>
                    <button type="submit">Post Message</button>
                </form>
            </section>
            <section class="board-section">
                <h2>Sticky Notes</h2>
                <div id="messages-container"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
